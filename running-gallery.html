        <div class="archive-hero-subtitle">Binondo, Manila</div>
        <div class="archive-hero-rule"></div>
        <div class="archive-hero-meta">STRIDES & SMILES IN MOTION</div>
      </div>
    </section>

    <!-- 2. ASYMMETRIC VISUAL FLOW (Binondo, Manila photos) -->

      <!-- Row 1: Large Left + Standard Right -->
      <div class="archive-flow-row archive-flow-row--left-large">
        <div class="archive-pic-wrap archive-pic--large scroll-reveal-img" data-delay="0">
          <img src="/Binondo photos-20261008T063001Z-1-001/Binondo photos/IMG_4159.jpg" alt="" class="expandable-pic" loading="lazy" />
        </div>
        <div class="archive-pic-wrap archive-pic--standard scroll-reveal-img" data-delay="0.15">
          <img src="/Binondo photos-20261008T063001Z-1-001/Binondo photos/IMG_4161.jpg" alt="" class="expandable-pic" loading="lazy" />
        </div>
      </div>

      <!-- Row 2: Standard Left + Tall Right (Offset) -->
      <div class="archive-flow-row archive-flow-row--offset-right">
        <div class="archive-pic-wrap archive-pic--standard scroll-reveal-img" data-delay="0.1">
          <img src="/Binondo photos-20261008T063001Z-1-001/Binondo photos/IMG_4162.jpg" alt="" class="expandable-pic" loading="lazy" />
        </div>
        <div class="archive-pic-wrap archive-pic--tall scroll-reveal-img" data-delay="0.2">
          <img src="/Binondo photos-20261008T063001Z-1-001/Binondo photos/IMG_4167.jpg" alt="" class="expandable-pic" loading="lazy" />
        </div>
      </div>

      <!-- Row 3: Center Portrait Focus -->
      <div class="archive-flow-row archive-flow-row--center-tall">
        <div class="archive-pic-wrap archive-pic--tall scroll-reveal-img" data-delay="0.05">
          <img src="/Binondo photos-20261008T063001Z-1-001/Binondo photos/IMG_4168.jpg" alt="" class="expandable-pic" loading="lazy" />
        </div>
      </div>

      <!-- Row 4: Two Balanced Portraits -->
      <div class="archive-flow-row archive-flow-row--equal">
        <div class="archive-pic-wrap archive-pic--standard scroll-reveal-img" data-delay="0">
          <img src="/Binondo photos-20261008T063001Z-1-001/Binondo photos/IMG_4178.jpg" alt="" class="expandable-pic" loading="lazy" />
        </div>
        <div class="archive-pic-wrap archive-pic--standard scroll-reveal-img" data-delay="0.15">
          <img src="/Binondo photos-20261008T063001Z-1-001/Binondo photos/IMG_4179.jpg" alt="" class="expandable-pic" loading="lazy" />

    </div>

        </div>

          <img src="/Binondo photos-20261008T063001Z-1-001/Binondo photos/IMG_4187.jpg" alt="" class="expandable-pic" loading="lazy" />

        <div class="archive-pic-wrap archive-pic--standard scroll-reveal-img" data-delay="0">

        </div>
        <div class="archive-pic-wrap archive-pic--standard scroll-reveal-img" data-delay="0.15">
          <img src="/Binondo photos-20261008T063001Z-1-001/Binondo photos/IMG_4190.jpg" alt="" class="expandable-pic" loading="lazy" />

      </div>

      <!-- Row 7: Full Landscape Breath -->
      <div class="archive-flow-row archive-flow-row--full">
        <div class="archive-pic-wrap archive-pic--full scroll-reveal-img" data-delay="0.05">
          <img src="/Binondo photos-20261008T063001Z-1-001/Binondo photos/IMG_4191.jpg" alt="" class="expandable-pic" loading="lazy" />
        </div>

      <!-- Row 8: Tall Left + Standard Right -->
      <div class="archive-flow-row archive-flow-row--left-large">
        <div class="archive-pic-wrap archive-pic--tall scroll-reveal-img" data-delay="0">
          <img src="/Binondo photos-20261008T063001Z-1-001/Binondo photos/IMG_4218.jpg" alt="" class="expandable-pic" loading="lazy" />
        </div>
        <div class="archive-pic-wrap archive-pic--standard scroll-reveal-img" data-delay="0.15">
          <img src="/Binondo photos-20261008T063001Z-1-001/Binondo photos/IMG_4221.jpg" alt="" class="expandable-pic" loading="lazy" />
        </div>

    </div>

    <!-- 5. BOTTOM SWITCHER TO PROPOSAL ARCHIVE -->
    <div class="archive-bottom-switcher">
      <div class="archive-bottom-card">
        <span class="archive-bottom-tag">Next Visual Collection</span>
        <h2 class="archive-bottom-title">The Proposal (Intramuros)</h2>
        <a href="/proposal-gallery.html" class="archive-bottom-btn">

    </div>

  </main>

  <!-- LIGHTBOX -->
  <div id="subpage-lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <button class="lightbox-close" aria-label="Close image viewer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 6L6 18M6 6L18 18"/>
      </svg>
    </button>
    <button class="lightbox-prev" aria-label="Previous image">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <button class="lightbox-next" aria-label="Next image">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>
    <div class="lightbox-content">
      <img id="subpage-lightbox-img" src="" alt="Gallery preview" />
      <div class="lightbox-counter">
        <span id="subpage-lightbox-current">1</span> / <span id="subpage-lightbox-total">16</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { gsap } from 'gsap';
    import { ScrollTrigger } from 'gsap/ScrollTrigger';

    gsap.registerPlugin(ScrollTrigger);

    // Smooth GPU-only entrance reveal (opacity + translateY, no clip-path for performance)
    const reveals = document.querySelectorAll('.scroll-reveal-img');

    // Stagger delays for rows in the same viewport
    reveals.forEach((el) => {
      const delay = parseFloat(el.dataset.delay || 0);
      const img = el.querySelector('img');

      gsap.set(el, { opacity: 0, y: 50 });

      ScrollTrigger.create({
        trigger: el,
        start: 'top 92%',
        onEnter: () => {
          el.classList.add('is-animating');
          gsap.to(el, {
            opacity: 1,
            y: 0,
            duration: 1.0,
            delay: delay,
            ease: 'power3.out',
            onComplete: () => el.classList.remove('is-animating'),
          });
          if (img) {
            gsap.fromTo(img,
              { scale: 1.07 },
              { scale: 1, duration: 1.3, delay: delay, ease: 'power2.out' }
            );
          }
        },
        once: true,
      });
    });

    // Parallax on full-bleed divider matching reference site
    const bleedImg = document.querySelector('.archive-bleed-img');
    if (bleedImg) {
      gsap.to(bleedImg, {
        yPercent: 18,
        ease: 'none',
        scrollTrigger: {
          trigger: bleedImg.parentElement,
          start: 'top bottom',
          end: 'bottom top',
          scrub: 1.2,
        },
      });
    }

    // Lightbox interactivity
    const picElements = Array.from(document.querySelectorAll('.expandable-pic'));
    const lightbox = document.getElementById('subpage-lightbox');
    const lightboxImg = document.getElementById('subpage-lightbox-img');
    const lightboxCurrent = document.getElementById('subpage-lightbox-current');
    const lightboxTotal = document.getElementById('subpage-lightbox-total');
    const closeBtn = lightbox?.querySelector('.lightbox-close');
    const prevBtn = lightbox?.querySelector('.lightbox-prev');
    const nextBtn = lightbox?.querySelector('.lightbox-next');

    let currentIndex = 0;
    const photos = picElements.map(img => img.src);

    if (lightboxTotal) lightboxTotal.textContent = photos.length;

    function showPhoto(idx) {
      currentIndex = (idx + photos.length) % photos.length;
      lightboxImg.style.opacity = '0';
      lightboxImg.src = photos[currentIndex];
      lightboxCurrent.textContent = currentIndex + 1;
      setTimeout(() => {
        lightboxImg.style.opacity = '1';
      }, 50);
    }

    function openLightbox(idx) {
      showPhoto(idx);
      lightbox.classList.add('active');
      document.body.classList.add('no-scroll');
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      document.body.classList.remove('no-scroll');
    }

    picElements.forEach((img, idx) => {
      img.addEventListener('click', (e) => {
        e.stopPropagation();
        openLightbox(idx);
      });
    });

    closeBtn?.addEventListener('click', closeLightbox);
    prevBtn?.addEventListener('click', () => showPhoto(currentIndex - 1));
    nextBtn?.addEventListener('click', () => showPhoto(currentIndex + 1));

    lightbox?.addEventListener('click', (e) => {
      if (e.target === lightbox || e.target.classList.contains('lightbox-content')) {
        closeLightbox();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (!lightbox?.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') showPhoto(currentIndex - 1);
      if (e.key === 'ArrowRight') showPhoto(currentIndex + 1);
    });
  </script>
</body>
</html>
